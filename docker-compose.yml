name: fox-eu

services:
  postgres:
    image: postgres:17-alpine
    container_name: fox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fox
      POSTGRES_PASSWORD: fox
      POSTGRES_DB: fox_eu
    ports:
      - '5442:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fox -d fox_eu']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: fox-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fox
      MINIO_ROOT_PASSWORD: foxsecret
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: fox-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set fox http://storage:9000 fox foxsecret &&
      mc mb --ignore-existing fox/fox-media &&
      mc anonymous set download fox/fox-media &&
      echo 'bucket fox-media ready'
      "

  mail:
    image: axllent/mailpit:v1.30
    container_name: fox-mail
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1030:1025'
      - '8030:8025'

volumes:
  postgres-data:
  storage-data:
