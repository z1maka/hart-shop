name: hart-shop

services:
  postgres:
    image: postgres:17-alpine
    container_name: hart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hart
      POSTGRES_PASSWORD: hart
      POSTGRES_DB: hart
    ports:
      - '5445:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hart -d hart']
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: hart-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hart
      MINIO_ROOT_PASSWORD: hartsecret
    ports:
      - '9030:9000'
      - '9031:9001'
    volumes:
      - storage-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: hart-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set hart http://storage:9000 hart hartsecret &&
      mc mb --ignore-existing hart/hart-media &&
      mc anonymous set download hart/hart-media &&
      echo 'bucket hart-media ready'
      "

  mail:
    image: axllent/mailpit:v1.30
    container_name: hart-mail
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1050:1025'
      - '8050:8025'

volumes:
  postgres-data:
  storage-data:
